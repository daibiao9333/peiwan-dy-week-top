name: Douyin week-top crawl

on:
  schedule:
    # 21:32 Asia/Shanghai ≈ 13:32 UTC
    - cron: "32 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: douyin-week-top
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v4

      - name: Checkout MediaCrawler
        uses: actions/checkout@v4
        with:
          repository: NanmiCoder/MediaCrawler
          path: MediaCrawler

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install MediaCrawler deps
        working-directory: MediaCrawler
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Apply peiwan overlay + cookies
        env:
          DY_COOKIES: ${{ secrets.DY_COOKIES }}
          MEDIACRAWLER_ROOT: ${{ github.workspace }}/MediaCrawler
        run: |
          test -n "$DY_COOKIES" || { echo "缺少 Secrets: DY_COOKIES"; exit 1; }
          mkdir -p MediaCrawler/scripts
          cp crawler-overlay/scripts/build_week_top_html.py MediaCrawler/scripts/
          python3 crawler-overlay/apply_peiwan_config.py

      - name: Crawl Douyin search
        working-directory: MediaCrawler
        run: |
          uv run main.py --platform dy --lt cookie --type search

      - name: Build HTML
        working-directory: MediaCrawler
        run: |
          if ! ls data/douyin/jsonl/search_contents_*.jsonl >/dev/null 2>&1; then
            echo "::warning::本次爬取没有 jsonl（抖音对 GitHub 云端 IP 常返回空结果）。保留现有 Pages，不覆盖。"
            exit 0
          fi
          python3 scripts/build_week_top_html.py
          ls -la data/douyin/*.html | head

      - name: Publish to GitHub Pages tree
        run: |
          # 统一总页由 Mac LaunchAgent + publish-week-top-pages.sh 维护。
          # Actions 云端常只有抖音空结果；绝不要用单平台 HTML 覆盖 index.html。
          HTML="MediaCrawler/data/douyin/陪玩抖音-三天热度Top-latest.html"
          # fallback legacy alias also written by builder for --days 3
          if [ ! -f "$HTML" ]; then
            echo "no new html; skip"
            exit 0
          fi
          echo "::notice::爬取产物已生成，但 Pages 统一总页请在 Mac 上 publish-week-top-pages.sh 更新。"
          echo "artifact path: $HTML"
          ls -la "$HTML"
